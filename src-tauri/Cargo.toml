[package]
name = "simple-reader"
version = "0.1.0"
description = "A minimal, portable e-book reader"
authors = ["OlegG90"]
license = "MIT"
repository = "https://github.com/OlegG90/simple-reader"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sreader_lib"

[[bin]]
name = "sreader"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"

[dev-dependencies]
tempfile = "3"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
