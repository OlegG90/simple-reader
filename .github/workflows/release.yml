# Builds sreader.exe for x64 and ARM64. A pushed `v*` tag publishes both to a
# GitHub Release; a manual run ("Run workflow") only uploads them as an artifact.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    # One x64 runner builds both: MSVC cross-compiles to ARM64.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - name: Check the tag matches the app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Select-String -Path src-tauri/Cargo.toml -Pattern '^version = "(.+)"' | Select-Object -First 1).Matches.Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} does not match the version in src-tauri/Cargo.toml (v$version)"
          }

      - uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc, aarch64-pc-windows-msvc

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - run: npm ci
      - run: npm test
      - run: npm run build:x64
      - run: npm run build:arm64

      - name: Collect the exes
        shell: pwsh
        run: |
          New-Item -ItemType Directory release -Force | Out-Null
          Copy-Item src-tauri/target/x86_64-pc-windows-msvc/release/sreader.exe release/sreader-x64.exe
          Copy-Item src-tauri/target/aarch64-pc-windows-msvc/release/sreader.exe release/sreader-arm64.exe

      - name: Publish the release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        run: >
          gh release create "${{ github.ref_name }}"
          release/sreader-x64.exe release/sreader-arm64.exe
          --title "Simple Reader ${{ github.ref_name }}"
          --generate-notes

      - name: Keep the exes (manual runs)
        if: "!startsWith(github.ref, 'refs/tags/')"
        uses: actions/upload-artifact@v4
        with:
          name: sreader
          path: release/
